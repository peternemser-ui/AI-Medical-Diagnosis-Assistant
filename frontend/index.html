<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Primary Meta Tags -->
    <meta name="title" content="MedDiagnose AI — AI Medical Diagnosis Assistant">
    <meta name="description" content="Get AI-powered medical diagnosis from 7 specialized agents. Upload symptoms, photos, and get comprehensive clinical reports with treatment recommendations.">
    <meta name="keywords" content="AI medical diagnosis, symptom checker, health AI, medical assistant, clinical analysis, telemedicine">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://meddiagnose.ai/">
    <meta property="og:title" content="MedDiagnose AI — AI Medical Diagnosis Assistant">
    <meta property="og:description" content="7 specialized AI agents collaborate on every diagnosis. Upload symptoms, photos, and get comprehensive clinical reports.">
    <meta property="og:image" content="https://meddiagnose.ai/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="MedDiagnose AI — AI Medical Diagnosis Assistant">
    <meta property="twitter:description" content="7 specialized AI agents collaborate on every diagnosis.">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MedDiagnose AI",
      "applicationCategory": "HealthApplication",
      "description": "AI-powered medical diagnosis assistant with 7 specialized agents",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <title>MedDiagnose AI — AI Medical Diagnosis Assistant</title>
  </head>
  <body class="font-sans text-gray-900">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
